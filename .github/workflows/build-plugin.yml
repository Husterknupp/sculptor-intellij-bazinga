name: Build plugin

# Builds and tests the plugin on every PR push and uploads the installable
# zip as a workflow artifact. The artifact link is in the job summary
# (PR > Checks > "Build plugin" > Summary).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-plugin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build the plugin zip
        run: ./gradlew build buildPlugin

      - name: Upload plugin zip
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: sculptor-intellij-bazinga-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Link the artifact in the job summary
        run: |
          {
            echo "### Installable plugin"
            echo
            echo "Commit \`${HEAD_SHA}\`: [download the plugin zip](${ARTIFACT_URL})"
            echo
            echo "Install via Settings > Plugins > gear icon > Install Plugin from Disk (IntelliJ IDEA 2026.2+)."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
